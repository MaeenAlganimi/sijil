<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Sijil is temporarily unavailable</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8f6;color:#17221d;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(440px,calc(100% - 36px));padding:38px;border:1px solid #e2e8e2;border-radius:12px;background:white;box-shadow:0 20px 60px #1b392018}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}.mark{width:34px;height:34px;border-radius:9px;background:#174f38;color:#fff;display:grid;place-items:center;font-size:21px}.symbol{margin-top:36px;width:44px;height:44px;border-radius:50%;background:#eef3ee;color:#527256;display:grid;place-items:center;font-size:22px}.card h1{font-family:Georgia,serif;font-size:30px;letter-spacing:-.7px;margin:18px 0 10px}.card p{color:#69766d;line-height:1.7;font-size:13px;margin:0}.error{display:block;margin-top:11px;color:#8a928c;font-size:11px;line-height:1.5;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:15px;margin-top:24px}button{border:0;border-radius:6px;padding:11px 16px;background:#174f38;color:white;font-size:13px;font-weight:600;cursor:pointer}button:hover{background:#236344}.hint{font-size:11px;color:#7a867d}@media(prefers-color-scheme:dark){body{background:#101813;color:#e9eee9}.card{background:#18221c;border-color:#2a382e}.symbol{background:#26352a;color:#a4c4a5}.card p,.hint{color:#a0aaa2}.error{color:#859187}}</style></head><body><main class="card"><div class="brand"><span class="mark">س</span><span>Sijil</span></div><div class="symbol">↻</div><h1>We can’t reach Sijil right now.</h1><p>The hosted app may be temporarily unavailable or your connection may be offline. Your documents are not stored in this desktop wrapper.</p><span class="error" id="message"></span><div class="acti
