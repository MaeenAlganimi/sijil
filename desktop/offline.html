<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Sijil is temporarily unavailable</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F2EE;color:#191919;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(440px,calc(100% - 36px));padding:38px;border:1px solid #D8D6D0;border-radius:2px;background:#FFFEFB}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}.mark{width:34px;height:34px;border-radius:2px;background:#2C4A6E;color:#fff;display:grid;place-items:center;font-size:21px}.symbol{margin-top:36px;width:44px;height:44px;border-radius:2px;background:#F3F2EE;color:#2C4A6E;display:grid;place-items:center;font-size:22px}.card h1{font-family:Georgia,serif;font-size:30px;letter-spacing:-.7px;margin:18px 0 10px}.card p{color:#5C5A55;line-height:1.7;font-size:13px;margin:0}.error{display:block;margin-top:11px;color:#8a928c;font-size:11px;line-height:1.5;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:15px;margin-top:24px}button{border:0;border-radius:2px;padding:11px 16px;background:#2C4A6E;color:white;font-size:13px;font-weight:600;cursor:pointer}button:hover{background:#2C4A6E}.hint{font-size:11px;color:#7a867d}</style></head><body><main class="card"><div class="brand"><span class="mark">س</span><span>Sijil</span></div><div class="symbol">↻</div><h1>We can’t reach Sijil right now.</h1><p>The hosted app may be temporarily unavailable or your connection may be offline. Your documents are not stored in this desktop wrapper.</p><span class="error" id="message"></span><div class="actions"><button onclick="window.sijil.retry()">Try again</button><span class="hint">Check your connection and retry.</span></div></main><script>const p=new URLSearchParams(location.search);document.getElementById('message').textContent=p.get('message')||'';</script></body></html>
