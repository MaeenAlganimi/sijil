<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Page not found — Sijil</title>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<style>
:root{color-scheme:light;--bg:#F3F2EE;--ink:#191919;--muted:#5C5A55;--rule:#D8D6D0;--accent:#2C4A6E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;padding:24px}
main{max-width:520px;width:100%;border-top:1px solid var(--rule);padding-top:28px}
.code{font-size:14px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
h1{font-size:28px;line-height:1.25;margin:0 0 10px}
p{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 18px}
a{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;padding:11px 18px;font-weight:600}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
section+section{margin-top:36px}
</style>
</head>
<body>
<main>
<section>
<p class="code">404</p>
<h1>Page not found</h1>
<p>This page doesn’t exist or has moved.</p>
<a href="/">Go to the Sijil home page</a>
</section>
<section lang="ar" dir="rtl">
<h1>الصفحة غير موجودة</h1>
<p>هذه الصفحة غير موجودة أو تم نقلها.</p>
<a href="/">العودة إلى الصفحة الرئيسية لـسجل</a>
</section>
</main>
</body>
</html>
