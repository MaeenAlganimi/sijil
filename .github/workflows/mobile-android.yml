name: Android app

# Builds the Sijil Android app from mobile/ (Capacitor wrapper around the hosted web app).
# - Every push / pull request that touches mobile/: a debug APK, uploaded as a workflow artifact.
# - Manual run (Actions → Android app → Run workflow): also a signed release .aab for Google Play,
#   but only when the signing secrets below exist in the repo settings:
#     ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown in the store (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sijil-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build signed release bundle (manual runs with signing secrets only)
        if: github.event_name == 'workflow_dispatch' && env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: sijil-android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
